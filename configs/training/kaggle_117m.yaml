# Nebium-Small (117M) — GPT-2 Small scale
# Chinchilla-optimal: ~2.3B tokens for 117M params
optimizer: adamw
learning_rate: 3e-4
weight_decay: 0.1
lr_scheduler: cosine
warmup_steps: 2000
batch_size: 4
epochs: 20
gradient_accumulation_steps: 32       # effective batch = 128 seqs
mixed_precision: fp16
gradient_clipping: 1.0
early_stopping_patience: 5
eval_samples: true
eval_puzzles: true
puzzle_path: "data/fixtures/puzzles.jsonl"
sample_prompts:
  - ""
  - "e2e4"
  - "d2d4"
sample_max_moves: 20
sample_temperature: 0.7
export_gguf: true
gguf_precision: fp16
generate_report: false
