[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nebium"
version = "0.1.0"
description = "A Transformer Model for Learning Chess in a Self-Supervised Manner"
requires-python = ">=3.10"      # adjust to your Python version
license = { text = "MIT" }      # or whatever you prefer
readme = "README.md"
dependencies = [
    "chess>=1.9.0",
    "huggingface-hub>=0.20.0",
    "hydra-core>=1.3.0",
    "matplotlib>=3.5.0",
    "numpy>=1.22.0",
    "seaborn>=0.12.0",
    "tensorboard>=2.10.0",
    "tokenizers>=0.15.0",
    "torch>=2.0.0",
    "tqdm>=4.60.0",
    "wandb>=0.15.0",
    "zstandard>=0.20.0",
    "gguf>=0.10.0",
    "requests>=2.28.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]               # treat every directory inside src/ as a package

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests",
]
