[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nebium"
version = "0.1.0"
description = "A Transformer Model for Learning Chess in a Self-Supervised Manner"
requires-python = ">=3.10"      # adjust to your Python version
license = { text = "MIT" }      # or whatever you prefer
readme = "README.md"
dependencies = [
    "hydra-core>=1.3.5",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "seaborn>=0.13.2",
    "tensorboard>=2.21.0",
    "tokenizers>=0.23.1",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "wandb>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]               # treat every directory inside src/ as a package

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
